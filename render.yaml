services:
  - type: web
    name: meet-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meet-monitor-db
          property: connectionString
      - key: MEET_MONITOR_SECRET
        generateValue: true
      - key: PRESENCE_API_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: meet-monitor-db
    databaseName: meet_monitor
    user: meet_monitor
    plan: free
