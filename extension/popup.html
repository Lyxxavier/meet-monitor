<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Monitor</title>
  <style>
    :root {
      --red: #D32F2F;
      --yellow: #FFC107;
      --text: #212121;
      --muted: #6B6B6B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 280px;
      font-family: system-ui, sans-serif;
      color: var(--text);
      background: #FFFFFF;
    }

    header {
      background: var(--red);
      color: #FFFFFF;
      padding: 12px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--yellow);
    }

    main { padding: 14px 16px 16px; }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 7px 0;
      border-bottom: 1px solid #EEEEEE;
    }

    .row:last-of-type { border-bottom: none; }

    .label { color: var(--muted); }

    .status { font-weight: 700; }
    .status.ok { color: #2E7D32; }
    .status.warn { color: var(--red); }

    a {
      display: block;
      text-align: center;
      margin-top: 12px;
      padding: 9px 12px;
      background: var(--yellow);
      color: var(--text);
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header><span class="dot"></span> Meet Monitor</header>
  <main>
    <div class="row">
      <span class="label">Backend</span>
      <span id="backend" class="status">checking&hellip;</span>
    </div>
    <div class="row">
      <span class="label">Last sync</span>
      <span id="last-sync">never</span>
    </div>
    <div class="row">
      <span class="label">Queued updates</span>
      <span id="queued">0</span>
    </div>
    <a href="http://localhost:5000/professor.html" target="_blank" rel="noopener">Open dashboard</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
