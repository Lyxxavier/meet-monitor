<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in &middot; Meet Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
  <header>
    <div class="brand"><span class="brand-dot"></span> Meet Monitor</div>
    <nav>
      <a href="index.html" class="btn-secondary">Home</a>
    </nav>
  </header>

  <main class="page">
    <section class="card card-narrow">
      <h1>Log in</h1>
      <p class="muted">
        Sign in with any Google account, including personal Gmail. Choose your Meet Monitor role;
        you can choose a different role the next time you sign in.
      </p>

      <form id="login-form" class="form">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="professor">Professor</option>
        </select>

        <button type="submit" class="btn-primary btn-block">Continue with Google</button>
      </form>
      <p id="login-error" class="error" role="alert" hidden></p>
      <p class="muted">Google confirms your account. Meet Monitor does not receive your Google password.</p>
    </section>
  </main>

  <footer>Meet Monitor &middot; proof of concept</footer>
  <script src="script.js"></script>
</body>
</html>
